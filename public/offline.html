<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Trubond</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f1f2f6;
        --card: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --primary: #1d4ed8;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --card: #131c31;
          --fg: #f8fafc;
          --muted: #94a3b8;
          --primary: #5b84f0;
          --border: #23304d;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        padding: 2.5rem 2rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--card);
      }
      .badge {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: var(--primary);
        color: #fff;
        font-size: 1.5rem;
        font-weight: 700;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.375rem; }
      p { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.9375rem; line-height: 1.5; }
      button {
        padding: 0.625rem 1.25rem;
        border: 0;
        border-radius: 0.625rem;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">T</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        Trubond needs a connection to load your feed. Check your internet and
        try again — anything already loaded will still be here.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
